<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clearly labelled hackathon prototype for exploring emergency response coordination. Not an emergency service."
    />
    <meta name="theme-color" content="#590907" />
    <title>Godavari — Coordination Prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          font-family: system-ui, sans-serif;
          max-width: 600px;
          margin: 40px auto;
          padding: 24px;
          border: 2px solid #590907;
          border-radius: 8px;
          background: #fdf8f2;
          color: #2d1a0e;
        "
      >
        <h2 style="color: #590907; margin-top: 0">JavaScript Required</h2>
        <p>JavaScript must be enabled to use the Godavari Coordination Prototype.</p>
      </div>
    </noscript>
    <script>
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML =
              '<div style="font-family:system-ui,-apple-system,sans-serif;max-width:680px;margin:60px auto;padding:36px;background:#FDF8F2;border:2px solid #590907;border-radius:12px;color:#2D1A0E;line-height:1.6;box-shadow:0 8px 32px rgba(89,9,7,0.12)">' +
              '<div style="display:inline-block;padding:4px 10px;background:#590907;color:#FDF8F2;font-size:11px;font-weight:700;border-radius:4px;letter-spacing:0.08em;margin-bottom:16px;">LOCAL FILE PROTOCOL DETECTED (file://)</div>' +
              '<h1 style="color:#590907;margin:0 0 14px;font-size:24px;font-weight:700;">This application requires a local web server</h1>' +
              '<p style="margin:0 0 16px;color:#6B635B;font-size:15px;">You have opened this HTML file directly from your file system. Modern web applications built with React, TypeScript, and client-side routing cannot execute over <code>file://</code> due to browser security (CORS) policies and the need for TypeScript compilation.</p>' +
              '<div style="background:#E8D2B5;padding:18px 22px;border-radius:8px;border-left:4px solid #590907;margin-bottom:20px;">' +
              '<strong style="color:#590907;display:block;margin-bottom:6px;font-size:14px;">How to launch the website correctly:</strong>' +
              '<p style="margin:0 0 10px;font-size:14px;color:#2D1A0E;">Double-click <strong>start-website.bat</strong> in the project folder, or run this command in your terminal:</p>' +
              '<pre style="background:#2D1A0E;color:#E8D2B5;padding:12px 16px;border-radius:6px;margin:0;font-size:13px;overflow-x:auto;">pnpm dev:web</pre>' +
              '</div>' +
              '<p style="margin:0;font-size:14px;color:#6B635B;">Once started, the website will open at <strong style="color:#590907;">http://localhost:3000</strong>.</p>' +
              '</div>';
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
